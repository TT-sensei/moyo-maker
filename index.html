<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f3ed"><title>もよう工房｜TT-sensei</title>
<style>
:root{--ink:#263238;--muted:#6b7a72;--line:#d6dbd5;--teal:#246c68;--paper:#f4f3ed;--accent:#f2b134}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--paper);color:var(--ink)}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#fff}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:52px;object-fit:contain}
.brand h1{font-size:20px;margin:0}
.brand .sub{color:var(--muted);font-size:12px}
.head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);text-decoration:none;display:inline-block}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:disabled{opacity:.4}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .count{color:var(--muted);font-size:13px}
.toolbar .hint{color:var(--muted);font-size:12px;margin-left:auto}
main{max-width:860px;margin:0 auto;padding:12px}
.board{background:#e9ece5;border-radius:12px;padding:10px}
svg#canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none}
.obj{cursor:grab}
.obj .hit{fill:transparent;stroke:none}
.sel-outline{fill:none;stroke:var(--teal);stroke-width:2.5;stroke-dasharray:6 4;pointer-events:none}
.quickbar{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}
.quickbar.show{display:flex}
.quickbar button{flex:1;min-width:100px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.quickbar button.main{background:var(--teal);border-color:var(--teal);color:#fff}
.status{margin-top:10px;text-align:center;color:var(--muted);font-size:14px;min-height:20px}
.drawer{position:fixed;top:0;bottom:0;width:min(320px,86vw);background:#fff;z-index:30;transition:transform .22s ease;overflow-y:auto;padding:16px;box-shadow:0 0 24px rgba(0,0,0,.18)}
#paletteDrawer{left:0;transform:translateX(-105%)}
#toolsDrawer{right:0;transform:translateX(105%)}
#paletteDrawer.drawer-open,#toolsDrawer.drawer-open{transform:translateX(0)}
.drawer h2{font-size:16px;margin:4px 0 10px}
.drawer h3{font-size:13px;color:var(--muted);margin:16px 0 6px}
#drawerBackdrop{position:fixed;inset:0;background:rgba(38,50,56,.35);z-index:20}
.shape-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shape-btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px 6px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.shape-btn svg{width:44px;height:44px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch.active{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.tool-list{display:flex;flex-direction:column;gap:8px}
.tool-list .btn{text-align:center}
.tool-list .btn.active{border-color:var(--teal);color:var(--teal);background:#e3f0ee}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#263238;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{padding:0 16px 18px;text-align:center;color:var(--muted);font-size:12px}
/* ===== tablet layout: panels stay visible, board uses the screen ===== */
@media (min-width:760px) and (min-height:520px){
  html,body{height:100%}
  body{display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:1fr 364px;
    grid-template-areas:"header header" "toolbar toolbar" "main palette" "main tools"}
  header .btn,.toolbar .btn{padding:10px 16px;font-size:15px}
  #paletteDrawer .shape-btn{font-size:13px;padding:10px 4px 8px}
  #paletteDrawer .shape-btn svg{width:54px;height:54px}
  #paletteDrawer .swatch{width:44px;height:44px}
  #toolsDrawer .btn{padding:11px 10px;font-size:15px}
  header{grid-area:header}
  .toolbar{grid-area:toolbar}
  main{grid-area:main;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;max-width:none;padding:10px}
  .board{height:min(100%,calc(100vw - 396px));aspect-ratio:1;width:auto}
  #paletteDrawer{grid-area:palette;position:static;transform:none;width:auto;box-shadow:none;border-left:1px solid var(--line);min-height:0}
  #toolsDrawer{grid-area:tools;position:static;transform:none;width:auto;box-shadow:none;border-left:1px solid var(--line);overflow-y:auto;min-height:0;max-height:46dvh}
  #toolsDrawer .tool-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #toolsDrawer h2{margin-bottom:2px}
  #toolsDrawer h3{margin:8px 0 4px}
  .drawer{padding:12px 14px}
  #drawerBackdrop{display:none}
  #paletteToggle,#toolsToggle{display:none}
  .quickbar{display:none !important}
  .status{display:none}
  footer{display:none}
}
@media (min-width:760px) and (min-height:520px) and (orientation:portrait){
  body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto;
    grid-template-areas:"header" "toolbar" "main" "palette" "tools"}
  .board{height:min(calc(100% - 42px),97vw);aspect-ratio:1;width:auto}
  .status{display:block}
  #paletteDrawer{border-left:none;max-height:212px;display:flex;gap:18px;align-items:flex-start;overflow-x:auto;overflow-y:hidden}
  #paletteDrawer h2{display:none}
  #paletteDrawer h3{margin-top:0;white-space:nowrap}
  #paletteDrawer .shape-grid{display:flex;gap:8px}
  #paletteDrawer .shape-btn{min-width:94px}
  #toolsDrawer .btn{padding:12px 16px}
  #paletteDrawer .swatches{max-width:210px}
  #paletteDrawer p{display:none}
  #toolsDrawer{border-left:none;display:flex;gap:10px;align-items:center;overflow-x:auto;overflow-y:hidden;padding:8px 14px;max-height:none}
  #toolsDrawer h2,#toolsDrawer h3{display:none}
  #toolsDrawer .tool-list{display:flex;flex-direction:row;flex-wrap:nowrap;gap:6px;margin:0}
  #toolsDrawer .tool-list .btn{flex:none;white-space:nowrap;min-width:0}
}
</style></head><body>
<header>
  <div class="brand">
    <img class="brand-character" src="https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/characters/riku/fullbody/waving.webp" alt="ナビキャラのリク">
    <div><h1>もよう工房</h1><div class="sub">パターンブロックで、もようをつくろう。</div></div>
  </div>
  <div class="head-actions">
    <a class="btn" href="tangram.html">🧩 タングラム</a>
    <button class="btn" id="newBtn">新しくつくる</button>
    <button class="btn primary" id="saveBtn">画像で保存</button>
  </div>
</header>
<div class="toolbar">
  <button class="btn" id="paletteToggle" aria-expanded="false">図形・色</button>
  <button class="btn" id="toolsToggle" aria-expanded="false">編集</button>
  <span class="count" id="count">図形 0こ</span>
  <button class="btn" id="snapBtn">ぴたっと：ON</button>
  <span class="hint">ピースを近づけると、頂点がドットにぴたっと吸着するよ</span>
</div>
<main>
  <div class="board"><svg id="canvas" viewBox="0 0 600 600" aria-label="もよう工房のキャンバス"></svg></div>
  <div class="quickbar" id="quickbar">
    <button id="qRotL">↶ まわす</button>
    <button id="qRotR" class="main">↷ まわす</button>
    <button id="qDup">ふやす</button>
    <button id="qLock">🔒 ロック</button>
    <button id="qDel">けす</button>
  </div>
  <div class="status" id="status">「図形・色」から、すきな図形をタップしてね。</div>
</main>
<footer>TT-sensei</footer>

<div id="drawerBackdrop" hidden></div>
<aside class="drawer" id="paletteDrawer" aria-label="図形と色のパネル">
  <h2>図形をえらぶ</h2>
  <h3>敷き詰め図形（辺の長さが全部同じ）</h3>
  <div class="shape-grid" id="tileGrid"></div>
  <h3>飾り図形</h3>
  <div class="shape-grid" id="decoGrid"></div>
  <h3>色をえらぶ</h3>
  <div class="swatches" id="swatches"></div>
  <p style="font-size:12px;color:var(--muted)">色は、選んでいる図形にぬられるよ。選んでいないときは、次に置く図形の色になるよ。</p>
</aside>
<aside class="drawer" id="toolsDrawer" aria-label="編集パネル">
  <h2>編集</h2>
  <h3>選んだ図形の操作</h3>
  <div class="tool-list">
    <button class="btn" id="tRotL">↶ まわす</button>
    <button class="btn" id="tRotR">↷ まわす</button>
    <button class="btn" id="tDup">ふやす</button>
    <button class="btn" id="tLock">🔒 ロック</button>
    <button class="btn" id="tDel">けす</button>
  </div>
  <div class="tool-list">
    <button class="btn" id="undoBtn">↩ もどす</button>
    <button class="btn" id="redoBtn">↪ やりなおす</button>
  </div>
  <h3>選んだ図形のアシスト</h3>
  <div class="tool-list">
    <button class="btn" id="mirrorBtn">⇋ 左右にコピー</button>
    <button class="btn" id="radialBtn">✿ 回転コピー（6方向）</button>
    <button class="btn" id="frontBtn">⬆ いちばん前へ</button>
    <button class="btn" id="backBtn">⬇ いちばん後ろへ</button>
  </div>
  <h3>キャンバス</h3>
  <div class="tool-list">
    <button class="btn active" id="gridBtn">格子：ドット</button>
    <button class="btn" id="clearBtn">ぜんぶ消す</button>
  </div>
</aside>
<div id="toast" role="status"></div>
<script src="app.js" defer></script>
</body></html>
