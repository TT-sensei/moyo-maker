<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f3ed"><title>タングラム｜TT-sensei</title>
<style>
:root{--ink:#263238;--muted:#6b7a72;--line:#d6dbd5;--teal:#246c68;--paper:#f4f3ed}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--paper);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:20px;margin:0}
header .sub{color:var(--muted);font-size:12px}
.back{margin-left:auto;text-decoration:none;color:var(--teal);font-weight:700;border:2px solid var(--teal);padding:7px 12px;border-radius:999px;font-size:14px;background:#fff}
.topics{display:flex;gap:8px;align-items:center;padding:10px 16px 0;flex-wrap:wrap}
.topics .label{font-weight:700;font-size:14px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:16px;cursor:pointer;font-family:inherit}
.chip.active{border-color:var(--teal);background:#e3f0ee;color:var(--teal);font-weight:700}
main{max-width:680px;margin:0 auto;padding:12px 12px 24px}
.board{background:#e9ece5;border-radius:12px;padding:10px}
svg{display:block;width:100%;height:auto;aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none}
.piece{cursor:grab;stroke:#263238;stroke-opacity:.25;stroke-width:1.5}
.piece.selected{stroke:#246c68;stroke-opacity:1;stroke-width:3}
.piece.done{stroke:#f2b134;stroke-width:3}
.target{fill:#dde3e8;stroke:#dde3e8;stroke-width:1}
.hintflash{fill:#ffd54d;opacity:.75;pointer-events:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1;min-width:120px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.actions button:disabled{opacity:.4}
.actions button.main{background:var(--teal);border-color:var(--teal);color:#fff}
.status{margin-top:12px;font-size:16px;min-height:24px;text-align:center}
.banner{display:none;margin-top:10px;text-align:center;font-size:26px;font-weight:900;color:#b7791f;background:#fff3d6;border:2px solid #f2b134;border-radius:12px;padding:12px}
.banner.show{display:block}
.note{color:var(--muted);font-size:13px;margin-top:10px;text-align:center}
</style></head><body>
<header>
<div><h1>🧩 タングラム</h1><div class="sub">7つのピースで、お題の形をつくろう。</div></div>
<a class="back" href="index.html">もよう工房にもどる</a>
</header>
<div class="topics"><span class="label">お題：</span><span id="chips"></span></div>
<main>
<div class="board"><svg id="board" viewBox="0 0 600 600" aria-label="タングラムのボード"></svg></div>
<div class="actions">
<button id="rotBtn" class="main">↷ まわす</button>
<button id="flipBtn">⇋ うらがえす</button>
<button id="hintBtn">💡 ヒント</button>
<button id="resetBtn">↺ はじめから</button>
</div>
<div id="banner" class="banner">🎉 かんせい！ 🎉</div>
<div id="status" class="status">ピースをタップして、ドラッグで動かそう。</div>
<p class="note">ピースをダブルタップしても回るよ。形がぴったり合うと、近くの頂点に吸着するよ。</p>
<p class="note">おてほんの多くは KiloGram Tangrams Dataset（Cornell LIL）の形を使っています。図形の出典：J. Slocum『The Tangram Book』（教育目的で利用）。</p>
</main>
<script src="tangram.js" defer></script>
</body></html>
